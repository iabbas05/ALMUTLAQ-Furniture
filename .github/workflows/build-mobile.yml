name: Build Almutlaq mobile apps

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-mobile.yml', 'lib/**', 'test/**', 'pubspec.yaml', 'tools/**', 'native/**', 'scripts/**', 'server/**', 'unity/**', '*.ps1', 'qa/**', 'ar-preview/**']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/build-mobile.yml', 'lib/**', 'test/**', 'pubspec.yaml', 'tools/**', 'native/**', 'scripts/**', 'server/**', 'unity/**', '*.ps1', 'qa/**', 'ar-preview/**']
  workflow_dispatch:
    inputs:
      ar_url:
        description: HTTPS URL of the published AR preview
        required: false
        type: string

permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check PowerShell scripts and repeat local startup without losing designs
        shell: powershell
        run: |
          ./scripts/test_headset_build.ps1
          ./scripts/test_launcher.ps1

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate both dimensioned demo models
        run: |
          python tools/generate_demo_models.py --output generated-models
          mkdir -p assets server/models
          cp generated-models/*.glb assets/
          python3 ar-preview/generate-usdz.py generated-models
          cp generated-models/*.usdz assets/
          cp generated-models/*.mesh.json server/models/
      - name: Generate and validate iOS product previews
        run: |
          python ar-preview/generate-usdz.py generated-models
          pip install --quiet usd-core
          python ar-preview/check-usdz.py generated-models
      - name: Test room protocol, storage, pairing, publishing and HTTP boundaries
        run: python -m unittest discover -s server -p test_showroom.py -v
      - name: Test staff panel in a browser
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python qa/check_staff.py
      - uses: actions/upload-artifact@v4
        with:
          name: Almutlaq-Staff-Previews
          path: build/staff-preview/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Almutlaq-Dimensioned-Demo-Models
          path: generated-models/
          if-no-files-found: error

  android:
    needs: protocol
    runs-on: ubuntu-latest
    env:
      SHOWROOM_AR_URL: ${{ inputs.ar_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
      - name: Prepare Android project
        run: |
          flutter create --no-pub --platforms android --org com.showroomxr --project-name london_showroom .
          python3 scripts/prepare_platforms.py android
          flutter pub get
      - name: Generate model and Arabic font assets
        run: |
          python3 tools/generate_demo_models.py --output generated-models
          mkdir -p assets
          cp generated-models/*.glb assets/
          python3 ar-preview/generate-usdz.py generated-models
          cp generated-models/*.usdz assets/
          font_base='https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic'
          curl --fail --silent --show-error --location --retry 3 "$font_base/NotoSansArabic%5Bwdth%2Cwght%5D.ttf" --output assets/NotoSansArabic.ttf
          curl --fail --silent --show-error --location --retry 3 "$font_base/OFL.txt" --output assets/NotoSansArabic-OFL.txt
          test -s assets/NotoSansArabic.ttf
          python3 scripts/fetch_demo_photos.py --required
      - run: dart format lib test
      - run: flutter analyze lib test
      - run: flutter test
      - uses: actions/upload-artifact@v4
        with:
          name: Almutlaq-App-Screenshots
          path: build/preview/
          if-no-files-found: error
      - run: flutter build apk --debug --dart-define="SHOWROOM_AR_URL=$SHOWROOM_AR_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: Almutlaq-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    needs: protocol
    runs-on: macos-latest
    env:
      SHOWROOM_AR_URL: ${{ inputs.ar_url }}
      # Optional. When all three secrets are set, the job also exports a signed IPA.
      # See BUILD.md "Signed iPhone build". Never commit these values.
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
      - name: Prepare iOS project and RoomPlan bridge
        run: |
          flutter create --no-pub --platforms ios --org com.showroomxr --project-name london_showroom .
          python3 scripts/prepare_platforms.py ios
          ruby -rxcodeproj -e 'p = Xcodeproj::Project.open("ios/Runner.xcodeproj"); g = p.main_group["Runner"]; t = p.targets.find { |x| x.name == "Runner" }; %w[RoomScanPlugin.swift ProductARPlugin.swift].each { |name| f = g.files.find { |x| x.path == name } || g.new_file(name); t.source_build_phase.add_file_reference(f) unless t.source_build_phase.files_references.include?(f) }; p.save'
          flutter pub get
      - name: Generate model and Arabic font assets
        run: |
          python3 tools/generate_demo_models.py --output generated-models
          mkdir -p assets
          cp generated-models/*.glb assets/
          python3 ar-preview/generate-usdz.py generated-models
          cp generated-models/*.usdz assets/
          font_base='https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic'
          curl --fail --silent --show-error --location --retry 3 "$font_base/NotoSansArabic%5Bwdth%2Cwght%5D.ttf" --output assets/NotoSansArabic.ttf
          curl --fail --silent --show-error --location --retry 3 "$font_base/OFL.txt" --output assets/NotoSansArabic-OFL.txt
          test -s assets/NotoSansArabic.ttf
          python3 scripts/fetch_demo_photos.py --required
      - run: dart format lib test
      - run: flutter analyze lib test
      - name: Build and package unsigned IPA
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --verbose --dart-define="SHOWROOM_AR_URL=$SHOWROOM_AR_URL" 2>&1 | tee ios-build.log
          mkdir -p build/unsigned/Payload
          ditto build/ios/iphoneos/Runner.app build/unsigned/Payload/Runner.app
          cd build/unsigned
          ditto -c -k --sequesterRsrc --keepParent Payload Almutlaq-Unsigned.ipa
          unzip -t Almutlaq-Unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Almutlaq-Unsigned-IPA
          path: build/unsigned/Almutlaq-Unsigned.ipa
          if-no-files-found: error
      - name: Install signing certificate and profile
        id: signing
        if: env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.mobileprovision"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)"
          test -n "$identity" || { echo "No code-signing identity in the certificate"; exit 1; }
          security cms -D -i "$RUNNER_TEMP/signing.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist" 2>/dev/null || true; }
          uuid="$(plist UUID)"
          team="$(plist 'TeamIdentifier:0')"
          app_id="$(plist 'Entitlements:application-identifier')"
          bundle_id="${app_id#*.}"
          if [ "$bundle_id" = "*" ] || [ -z "$bundle_id" ]; then bundle_id="com.showroomxr.londonShowroom"; fi
          if [ -n "$(plist ProvisionsAllDevices)" ]; then method=enterprise
          elif [ -n "$(plist 'ProvisionedDevices:0')" ]; then method=release-testing
          else method=app-store-connect; fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/signing.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          IDENTITY="$identity" TEAM="$team" UUID="$uuid" BUNDLE="$bundle_id" ruby -rxcodeproj -e '
            p = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            t = p.targets.find { |x| x.name == "Runner" }
            t.build_configurations.select { |c| c.name == "Release" }.each do |c|
              c.build_settings["CODE_SIGN_STYLE"] = "Manual"
              c.build_settings["DEVELOPMENT_TEAM"] = ENV["TEAM"]
              c.build_settings["CODE_SIGN_IDENTITY"] = ENV["IDENTITY"]
              c.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV["UUID"]
              c.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = ENV["BUNDLE"]
            end
            p.save'
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$method</string>
            <key>teamID</key><string>$team</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$bundle_id</key><string>$uuid</string></dict>
          </dict></plist>
          PLIST
          echo "Signing $bundle_id for team $team with $method profile"
      - name: Build signed IPA
        if: steps.signing.outcome == 'success'
        run: |
          set -o pipefail
          flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" --dart-define="SHOWROOM_AR_URL=$SHOWROOM_AR_URL" 2>&1 | tee ios-signed-build.log
          ls build/ios/ipa/*.ipa
      - uses: actions/upload-artifact@v4
        if: steps.signing.outcome == 'success'
        with:
          name: Almutlaq-Signed-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Remove signing keychain
        if: always() && steps.signing.outcome != 'skipped'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - name: Upload iOS diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Almutlaq-iOS-Build-Log
          path: ios-*build.log
          if-no-files-found: ignore

