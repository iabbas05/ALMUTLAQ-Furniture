name: Build AR preview page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ar-preview.yml'
      - 'ar-preview/**'
      - 'tools/generate_demo_models.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ar-preview.yml'
      - 'ar-preview/**'
      - 'tools/generate_demo_models.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ar-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate GLB and USDZ for every demo product
        run: |
          python3 tools/generate_demo_models.py --output generated-models
          python3 ar-preview/generate-usdz.py generated-models
      - name: Check each USDZ opens at the published size
        run: |
          pip install --quiet usd-core
          python3 ar-preview/check-usdz.py generated-models
      - name: Assemble site
        run: |
          mkdir site
          cp ar-preview/index.html generated-models/*.glb generated-models/*.usdz site/
      - uses: actions/upload-artifact@v4
        with:
          name: ar-preview-site
          path: site
          if-no-files-found: error
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Needs GitHub Pages enabled once: Settings > Pages > Source: GitHub Actions.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
