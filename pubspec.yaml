name: london_showroom
description: Native furniture shopping and measured room planning for The Factory and CityW.
publish_to: none
version: 0.8.1+9
environment:
  sdk: ^3.8.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^8.3.1
  html: ^0.15.6
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/NotoSansArabic.ttf
  assets:
    - assets/
